
name: Build Mozakrty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -o MozakrtyAPKProject.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/MozakrtyAPKProject
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mozakrty-APK
          path: extracted/MozakrtyAPKProject/app/build/outputs/apk/debug/app-debug.apk
